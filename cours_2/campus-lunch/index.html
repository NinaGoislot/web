<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Lunch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="campus-page">
    <a class="back-link" href="../../index.html" aria-label="Return to the main project selection page">← Back to projects</a>

    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">Campus Dining</p>
      <h1 id="page-title">Campus Lunch</h1>
      <p class="hero-copy">
        Browse the lunch menu by day and compare meals at a glance.
      </p>
    </section>

    <section class="filter-panel" aria-label="Lunch day filters">
      <div class="filter-tabs" role="tablist" aria-label="Select a day">
        <button class="filter-tab" type="button" data-day="Monday" aria-pressed="true">Monday</button>
        <button class="filter-tab" type="button" data-day="Tuesday" aria-pressed="false">Tuesday</button>
        <button class="filter-tab" type="button" data-day="Wednesday" aria-pressed="false">Wednesday</button>
        <button class="filter-tab" type="button" data-day="Thursday" aria-pressed="false">Thursday</button>
        <button class="filter-tab" type="button" data-day="Friday" aria-pressed="false">Friday</button>
        <button class="filter-tab" type="button" data-day="Saturday" aria-pressed="false">Saturday</button>
      </div>
      <div id="meal-count" class="meal-count" aria-live="polite"></div>
    </section>

    <section id="meals" class="meal-grid" aria-live="polite"></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
